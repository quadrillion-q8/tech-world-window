name: Live production smoke checks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: live-production-smoke-checks
  cancel-in-progress: false

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check public production routes
        run: node scripts/smoke-test-live-site.mjs
